name: Build 1.8-eu Test Firmware

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build-halowlink2:
    name: Build EU HaLowLink 2
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: halowlink2
      target: ramips
      subtarget: mt7621
      description: '1.8-eu test: HaLowLink 2 MM8108 SDIO'
      releasepackages: false

  build-ekh-bcm2711:
    name: Build EU Pi 4 / CM4
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: ekh-bcm2711
      target: bcm27xx
      subtarget: bcm2711
      description: '1.8-eu test: Raspberry Pi 4 / CM4 MM8108 USB'
      releasepackages: false

  verify-images:
    name: Verify EU image contents
    needs: [build-halowlink2, build-ekh-bcm2711]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          path: eu-artifacts
          merge-multiple: true
      - name: Install image inspection tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Verify images and prepare release assets
        run: python3 scripts/eu-test/verify_images.py eu-artifacts eu-release
      - uses: actions/upload-artifact@v7
        with:
          name: 1.8-eu-verified-release
          path: eu-release/*
          if-no-files-found: error
          retention-days: 14
