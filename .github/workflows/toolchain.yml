name: Build Toolchains

on:
  pull_request:
    paths:
      - '.github/workflows/toolchain.yml'
      - 'toolchain/**'
  push:
    paths:
      - '.github/workflows/toolchain.yml'
      - 'toolchain/**'
    branches-ignore:
      - '24.10'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-toolchains:
    name: Build supported toolchain
    permissions:
      contents: read
      packages: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # Keep aligned with the five board families in build-release.yml.
        include:
          - target: bcm27xx
            subtarget: bcm2710
          - target: bcm27xx
            subtarget: bcm2711
          - target: ramips
            subtarget: mt7621
          - target: ramips
            subtarget: mt76x8
          - target: imx
            subtarget: cortexa53
    uses: openwrt/actions-shared-workflows/.github/workflows/reusable_build.yml@main
    with:
      target: ${{ matrix.target }}
      subtarget: ${{ matrix.subtarget }}
      build_toolchain: true
