name: Build Kernel

on:
  pull_request:
    paths:
      - '.github/workflows/check-kernel-patches.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/kernel.yml'
      - 'include/kernel*'
      - 'package/kernel/**'
      - 'target/linux/**'
  push:
    paths:
      - '.github/workflows/check-kernel-patches.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/kernel.yml'
      - 'include/kernel*'
      - 'package/kernel/**'
      - 'target/linux/**'
    branches-ignore:
      - '24.10'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  determine-changed-files:
    uses: openwrt/actions-shared-workflows/.github/workflows/reusable_determine_changed_files.yml@main

  determine-changed-packages:
    needs: determine-changed-files
    uses: openwrt/actions-shared-workflows/.github/workflows/reusable_determine_changed_packages.yml@main
    with:
      all_changed_files: ${{ needs.determine-changed-files.outputs.all_changed_files }}

  build-kernels:
    name: Build supported kernel
    needs: determine-changed-packages
    permissions:
      contents: read
      packages: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # Keep aligned with the five board families in build-release.yml.
        include:
          - target: bcm27xx
            subtarget: bcm2710
          - target: bcm27xx
            subtarget: bcm2711
          - target: ramips
            subtarget: mt7621
          - target: ramips
            subtarget: mt76x8
          - target: imx
            subtarget: cortexa53
    uses: openwrt/actions-shared-workflows/.github/workflows/reusable_build.yml@main
    with:
      container_name: toolchain
      target: ${{ matrix.target }}
      subtarget: ${{ matrix.subtarget }}
      build_kernel: true
      build_all_kmods: true
      build_dtb: true
      check_packages_list: ${{ needs.determine-changed-packages.outputs.changed_packages }}

  check-kernel-patches:
    name: Check supported kernel patches
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Keep aligned with the five board families in build-release.yml.
        include:
          - target: bcm27xx
            subtarget: bcm2710
          - target: bcm27xx
            subtarget: bcm2711
          - target: ramips
            subtarget: mt7621
          - target: ramips
            subtarget: mt76x8
          - target: imx
            subtarget: cortexa53
    uses: openwrt/actions-shared-workflows/.github/workflows/reusable_check-kernel-patches.yml@main
    with:
      target: ${{ matrix.target }}
      subtarget: ${{ matrix.subtarget }}
